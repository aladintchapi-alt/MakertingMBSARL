<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9AFF01" />
      <stop offset="100%" stop-color="#26C992" />
    </linearGradient>
    <linearGradient id="mbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9AFF01" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#26C992" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Anneau Extérieur Circulaire -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#mbGradient)" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Monogramme MB Vectoriel Stylisé -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Branche Gauche M (Mint) -->
    <path d="M 120 370 L 120 130 L 210 270" stroke="#26C992" stroke-width="32"/>
    
    <!-- Branche Droite M + Axe Central B (Lime) -->
    <path d="M 210 270 L 300 130 L 300 370" stroke="#9AFF01" stroke-width="32"/>
    
    <!-- Boucles du B (Gradient Lime vers Mint) -->
    <path d="M 300 135 C 385 135, 385 245, 300 245 C 395 245, 395 365, 300 365" stroke="url(#mbGradient)" stroke-width="32"/>
  </g>

  <!-- Point Électrique d'Accentuation -->
  <circle cx="250" cy="80" r="10" fill="#9AFF01" filter="url(#subtleGlow)"/>
</svg>
